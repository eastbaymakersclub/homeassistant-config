substitutions:
  name: album-tag-reader
  friendly_name: "Album Tag Reader"
  album_cards_base_url: "http://192.168.67.2:8099"
  pn532_sda_pin: "23"
  pn532_scl_pin: "22"
  activity_led_pin: "13"
  same_tag_cooldown_ms: "120000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: featheresp32
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml

i2c:
  sda: ${pn532_sda_pin}
  scl: ${pn532_scl_pin}
  scan: true

http_request:
  timeout: 5s
  buffer_size_rx: 2048
  buffer_size_tx: 1024

output:
  - platform: gpio
    id: activity_led_output
    pin: ${activity_led_pin}

light:
  - platform: binary
    id: activity_led
    name: "Activity LED"
    output: activity_led_output
    restore_mode: ALWAYS_OFF

globals:
  - id: current_tag_url
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: last_played_tag_key
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: last_played_at
    type: uint32_t
    restore_value: no
    initial_value: "0"

script:
  - id: blink_tag_detected
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 80ms
      - light.turn_off: activity_led

  - id: blink_play_success
    mode: restart
    then:
      - repeat:
          count: 2
          then:
            - light.turn_on: activity_led
            - delay: 120ms
            - light.turn_off: activity_led
            - delay: 120ms

  - id: blink_reader_error
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 900ms
      - light.turn_off: activity_led

  - id: blink_reader_info
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 250ms
      - light.turn_off: activity_led

pn532_i2c:
  id: pn532_board
  update_interval: 750ms
  on_tag:
    then:
      - script.execute: blink_tag_detected
      - lambda: |-
          id(current_tag_url).clear();
          id(last_tag_uid).publish_state(x);

          if (!tag.has_ndef_message()) {
            ESP_LOGI("album_tag_reader", "Read tag %s without an NDEF message", x.c_str());
            id(last_tag_url).publish_state("");
            return;
          }

          auto message = tag.get_ndef_message();
          auto records = message->get_records();
          for (auto &record : records) {
            std::string payload = record->get_payload();
            size_t url_start = payload.find("https://");
            if (url_start == std::string::npos) {
              url_start = payload.find("http://");
            }
            if (url_start != std::string::npos) {
              id(current_tag_url) = payload.substr(url_start);
              ESP_LOGI("album_tag_reader", "Read tag %s URL %s", x.c_str(), id(current_tag_url).c_str());
              id(last_tag_url).publish_state(id(current_tag_url));
              return;
            }
          }

          ESP_LOGI("album_tag_reader", "Read tag %s without an album URL", x.c_str());
          id(last_tag_url).publish_state("");
      - if:
          condition:
            lambda: |-
              return !x.empty() &&
                (id(last_played_tag_key) != x || millis() - id(last_played_at) > ${same_tag_cooldown_ms});
          then:
            - http_request.post:
                url: ${album_cards_base_url}/api/hardware/tag-scans
                request_headers:
                  Content-Type: application/json
                capture_response: true
                max_response_buffer_size: 512
                json: |-
                  root["device"] = "${name}";
                  root["tagUid"] = x;
                  if (!id(current_tag_url).empty()) {
                    root["tagUrl"] = id(current_tag_url);
                  }
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(reader_status).publish_state("Played album");
                          id(last_played_tag_key) = x;
                          id(last_played_at) = millis();
                          id(blink_play_success).execute();
                        } else if (response->status_code == 404) {
                          id(reader_status).publish_state("Unknown album tag");
                          id(blink_reader_error).execute();
                        } else {
                          id(reader_status).publish_state("Playback request failed");
                          id(blink_reader_error).execute();
                        }
                on_error:
                  then:
                    - text_sensor.template.publish:
                        id: reader_status
                        state: "Album Cards API unreachable"
                    - script.execute: blink_reader_error
          else:
            - lambda: |-
                ESP_LOGI("album_tag_reader", "Skipped recently played tag %s URL %s", x.c_str(), id(current_tag_url).c_str());
                id(reader_status).publish_state("Tag already played");
                id(blink_reader_info).execute();
  on_tag_removed:
    then:
      - text_sensor.template.publish:
          id: reader_status
          state: "Idle"

button:
  - platform: template
    name: "Clear Status"
    icon: mdi:broom
    entity_category: config
    on_press:
      then:
        - text_sensor.template.publish:
            id: reader_status
            state: "Idle"
        - text_sensor.template.publish:
            id: last_tag_uid
            state: ""
        - text_sensor.template.publish:
            id: last_tag_url
            state: ""

text_sensor:
  - platform: template
    name: "Last Tag UID"
    id: last_tag_uid
    icon: mdi:nfc
    entity_category: diagnostic

  - platform: template
    name: "Last Tag URL"
    id: last_tag_url
    icon: mdi:link
    entity_category: diagnostic

  - platform: template
    name: "Reader Status"
    id: reader_status
    icon: mdi:album
    entity_category: diagnostic
