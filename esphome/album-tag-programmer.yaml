substitutions:
  name: album-tag-programmer
  friendly_name: "Album Tag Programmer"
  album_cards_base_url: "http://192.168.67.2:8099"
  pn532_sda_pin: "23"
  pn532_scl_pin: "22"
  activity_led_pin: "13"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: featheresp32
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml

i2c:
  sda: ${pn532_sda_pin}
  scl: ${pn532_scl_pin}
  scan: true

http_request:
  timeout: 5s
  buffer_size_rx: 2048
  buffer_size_tx: 1024

output:
  - platform: gpio
    id: activity_led_output
    pin: ${activity_led_pin}

light:
  - platform: binary
    id: activity_led
    name: "Activity LED"
    output: activity_led_output
    restore_mode: ALWAYS_OFF

globals:
  - id: pending_tag_job_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_tag_url
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: current_tag_uid
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  - id: write_pending_tag
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(pending_tag_url).empty();"
          then:
            - lambda: |-
                auto message = new nfc::NdefMessage();
                message->add_uri_record(id(pending_tag_url));
                id(pn532_board).write_mode(message);
            - wait_until:
                not:
                  pn532.is_writing:
            - http_request.post:
                url: !lambda |-
                  return std::string("${album_cards_base_url}/api/hardware/tag-writes/") + id(pending_tag_job_id) + "/complete";
                request_headers:
                  Content-Type: application/json
                capture_response: true
                max_response_buffer_size: 512
                json: |-
                  root["ok"] = true;
                  root["tagUid"] = id(current_tag_uid);
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(writer_status).publish_state("Wrote album tag");
                          id(pending_tag_job_id).clear();
                          id(pending_tag_url).clear();
                          id(pending_url_sensor).publish_state("");
                        } else {
                          id(writer_status).publish_state("Could not confirm tag write");
                        }
                    - light.turn_off: activity_led
                on_error:
                  then:
                    - text_sensor.template.publish:
                        id: writer_status
                        state: "Could not confirm tag write"
                    - light.turn_off: activity_led
          else:
            - light.turn_off: activity_led

pn532_i2c:
  id: pn532_board
  update_interval: 750ms
  on_tag:
    then:
      - light.turn_on: activity_led
      - lambda: |-
          id(current_tag_uid) = x;
          id(last_tag_uid).publish_state(x);
          id(writer_status).publish_state("Checking queued album tag");
      - http_request.get:
          url: ${album_cards_base_url}/api/hardware/tag-writes/next
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  id(pending_tag_job_id).clear();
                  id(pending_tag_url).clear();

                  if (response->status_code != 200) {
                    id(writer_status).publish_state("Could not fetch queued tag");
                    return;
                  }

                  bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                    JsonObject job = root["job"];
                    if (job.isNull()) {
                      id(writer_status).publish_state("No queued album tag");
                      return true;
                    }

                    const char *job_id = job["id"] | "";
                    const char *tag_url = job["tagUrl"] | "";
                    if (strlen(job_id) == 0 || strlen(tag_url) == 0) {
                      id(writer_status).publish_state("Queued tag response was incomplete");
                      return false;
                    }

                    id(pending_tag_job_id) = job_id;
                    id(pending_tag_url) = tag_url;
                    id(pending_url_sensor).publish_state(tag_url);
                    id(writer_status).publish_state("Writing album tag");
                    return true;
                  });

                  if (!parsed) {
                    id(writer_status).publish_state("Could not parse queued tag");
                  }
              - script.execute: write_pending_tag
          on_error:
            then:
              - text_sensor.template.publish:
                  id: writer_status
                  state: "Album Cards API unreachable"
              - light.turn_off: activity_led

button:
  - platform: template
    name: "Clear Pending Tag"
    icon: mdi:broom
    entity_category: config
    on_press:
      then:
        - lambda: |-
            id(pending_tag_job_id).clear();
            id(pending_tag_url).clear();
        - text_sensor.template.publish:
            id: writer_status
            state: "Cleared local pending tag"
        - text_sensor.template.publish:
            id: pending_url_sensor
            state: ""

text_sensor:
  - platform: template
    name: "Last Tag UID"
    id: last_tag_uid
    icon: mdi:nfc
    entity_category: diagnostic

  - platform: template
    name: "Pending Tag URL"
    id: pending_url_sensor
    icon: mdi:link
    entity_category: diagnostic

  - platform: template
    name: "Writer Status"
    id: writer_status
    icon: mdi:playlist-edit
    entity_category: diagnostic
