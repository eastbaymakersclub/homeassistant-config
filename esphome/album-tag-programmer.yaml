substitutions:
  name: album-tag-programmer
  friendly_name: "Album Tag Programmer"
  album_cards_base_url: "http://192.168.67.2:8099"
  pn532_sda_pin: "23"
  pn532_scl_pin: "22"
  activity_led_pin: "13"
  tag_verify_timeout_ms: "15000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: featheresp32
  framework:
    type: esp-idf

packages:
  common: !include common/common.yaml

i2c:
  sda: ${pn532_sda_pin}
  scl: ${pn532_scl_pin}
  scan: true

http_request:
  timeout: 5s
  buffer_size_rx: 2048
  buffer_size_tx: 1024

output:
  - platform: gpio
    id: activity_led_output
    pin: ${activity_led_pin}

light:
  - platform: binary
    id: activity_led
    name: "Activity LED"
    output: activity_led_output
    restore_mode: ALWAYS_OFF

globals:
  - id: pending_tag_job_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_tag_url
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_tag_needs_arm
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pending_tag_verifying
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pending_tag_verify_started_at
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: current_tag_uid
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: current_tag_url
    type: std::string
    restore_value: no
    initial_value: '""'

script:
  - id: blink_waiting_for_tag
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 120ms
      - light.turn_off: activity_led

  - id: blink_write_success
    mode: restart
    then:
      - repeat:
          count: 3
          then:
            - light.turn_on: activity_led
            - delay: 100ms
            - light.turn_off: activity_led
            - delay: 120ms

  - id: blink_writer_error
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 900ms
      - light.turn_off: activity_led

  - id: blink_writer_info
    mode: restart
    then:
      - light.turn_on: activity_led
      - delay: 250ms
      - light.turn_off: activity_led

  - id: arm_pending_tag_write
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(pending_tag_url).empty();"
          then:
            - lambda: |-
                id(pending_tag_verifying) = false;
                id(pending_tag_verify_started_at) = 0;
                auto message = new nfc::NdefMessage();
                message->add_uri_record(id(pending_tag_url));
                id(pn532_board).write_mode(message);
            - text_sensor.template.publish:
                id: writer_status
                state: "Ready to write album tag"
            - script.execute: blink_waiting_for_tag
          else:
            - lambda: |-
                id(pending_tag_verifying) = false;
                id(pending_tag_verify_started_at) = 0;
                id(pn532_board).read_mode();
            - light.turn_off: activity_led

interval:
  - interval: 2s
    then:
      - http_request.get:
          url: ${album_cards_base_url}/api/hardware/tag-writes/next
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  id(pending_tag_needs_arm) = false;

                  if (response->status_code != 200) {
                    id(pending_tag_job_id).clear();
                    id(pending_tag_url).clear();
                    id(pending_tag_verifying) = false;
                    id(pending_tag_verify_started_at) = 0;
                    id(current_tag_uid).clear();
                    id(current_tag_url).clear();
                    id(pending_url_sensor).publish_state("");
                    id(pending_tag_needs_arm) = true;
                    id(writer_status).publish_state("Could not fetch active tag");
                    return;
                  }

                  bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                    JsonObject job = root["job"];
                    if (job.isNull()) {
                      if (!id(pending_tag_job_id).empty() || !id(pending_tag_url).empty()) {
                        id(pending_tag_job_id).clear();
                        id(pending_tag_url).clear();
                        id(pending_tag_verifying) = false;
                        id(pending_tag_verify_started_at) = 0;
                        id(current_tag_uid).clear();
                        id(current_tag_url).clear();
                        id(pending_url_sensor).publish_state("");
                        id(pending_tag_needs_arm) = true;
                        id(writer_status).publish_state("No active album tag");
                      }
                      return true;
                    }

                    const char *job_id = job["id"] | "";
                    const char *tag_url = job["tagUrl"] | "";
                    if (strlen(job_id) == 0 || strlen(tag_url) == 0) {
                      id(writer_status).publish_state("Active tag response was incomplete");
                      return false;
                    }

                    bool changed = id(pending_tag_job_id) != job_id || id(pending_tag_url) != tag_url;
                    id(pending_tag_job_id) = job_id;
                    id(pending_tag_url) = tag_url;
                    id(pending_url_sensor).publish_state(tag_url);

                    if (changed) {
                      id(current_tag_uid).clear();
                      id(current_tag_url).clear();
                      id(pending_tag_verifying) = false;
                      id(pending_tag_verify_started_at) = 0;
                      id(pending_tag_needs_arm) = true;
                      id(writer_status).publish_state("Active tag ready; place NFC tag");
                    }
                    return true;
                  });

                  if (!parsed) {
                    id(writer_status).publish_state("Could not parse active tag");
                  }
              - if:
                  condition:
                    lambda: "return id(pending_tag_needs_arm);"
                  then:
                    - lambda: "id(pending_tag_needs_arm) = false;"
                    - script.execute: arm_pending_tag_write
                  else:
                    - if:
                        condition:
                          lambda: "return !id(pending_tag_job_id).empty() && !id(pending_tag_verifying);"
                        then:
                          - script.execute: blink_waiting_for_tag
          on_error:
            then:
              - lambda: |-
                  id(pending_tag_job_id).clear();
                  id(pending_tag_url).clear();
                  id(pending_tag_verifying) = false;
                  id(pending_tag_verify_started_at) = 0;
                  id(current_tag_uid).clear();
                  id(current_tag_url).clear();
                  id(pending_url_sensor).publish_state("");
                  id(pending_tag_needs_arm) = true;
              - text_sensor.template.publish:
                  id: writer_status
                  state: "Album Cards API unreachable"
              - script.execute: arm_pending_tag_write
              - script.execute: blink_writer_error

  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(pending_tag_verifying) &&
                !id(pending_tag_job_id).empty() &&
                millis() - id(pending_tag_verify_started_at) > ${tag_verify_timeout_ms};
          then:
            - http_request.post:
                url: !lambda |-
                  return std::string("${album_cards_base_url}/api/hardware/tag-writes/") + id(pending_tag_job_id) + "/complete";
                request_headers:
                  Content-Type: application/json
                capture_response: true
                max_response_buffer_size: 512
                json: |-
                  root["ok"] = false;
                  root["error"] = "Timed out verifying tag readback";
                  if (!id(current_tag_url).empty()) {
                    root["tagUrl"] = id(current_tag_url);
                  }
                  if (!id(current_tag_uid).empty()) {
                    root["tagUid"] = id(current_tag_uid);
                  }
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(writer_status).publish_state("Tag write failed verification; try again");
                          id(pending_tag_job_id).clear();
                          id(pending_tag_url).clear();
                          id(pending_tag_verifying) = false;
                          id(pending_tag_verify_started_at) = 0;
                          id(current_tag_uid).clear();
                          id(current_tag_url).clear();
                          id(pending_url_sensor).publish_state("");
                          id(pn532_board).read_mode();
                          id(blink_writer_error).execute();
                        } else {
                          id(writer_status).publish_state("Could not report verification failure");
                          id(blink_writer_error).execute();
                        }
                on_error:
                  then:
                    - text_sensor.template.publish:
                        id: writer_status
                        state: "Could not report verification failure"
                    - script.execute: blink_writer_error

pn532_i2c:
  id: pn532_board
  update_interval: 750ms
  on_finished_write:
    then:
      - if:
          condition:
            lambda: "return !id(pending_tag_job_id).empty();"
          then:
            - lambda: |-
                id(pending_tag_verifying) = true;
                id(pending_tag_verify_started_at) = millis();
                id(current_tag_uid).clear();
                id(current_tag_url).clear();
                id(writer_status).publish_state("Wrote album tag; keep tag in place to verify");
            - delay: 250ms
            - lambda: |-
                id(pn532_board).read_mode();
            - script.execute: blink_writer_info
  on_tag:
    then:
      - lambda: |-
          id(current_tag_uid) = x;
          id(current_tag_url).clear();
          id(last_tag_uid).publish_state(x);

          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            auto records = message->get_records();
            for (auto &record : records) {
              std::string payload = record->get_payload();
              size_t url_start = payload.find("https://");
              if (url_start == std::string::npos) {
                url_start = payload.find("http://");
              }
              if (url_start != std::string::npos) {
                id(current_tag_url) = payload.substr(url_start);
                break;
              }
            }
          }

          if (!id(pending_tag_job_id).empty() && id(pending_tag_verifying)) {
            if (id(current_tag_url) == id(pending_tag_url)) {
              id(writer_status).publish_state("Verified album tag");
            } else if (id(current_tag_url).empty()) {
              id(writer_status).publish_state("Verification failed: no album URL read");
              id(blink_writer_error).execute();
            } else {
              id(writer_status).publish_state("Verification failed: read different URL");
              id(blink_writer_error).execute();
            }
          } else if (id(pending_tag_job_id).empty()) {
            id(writer_status).publish_state(
              id(current_tag_url).empty()
                ? "Saw tag; no active album tag"
                : "Saw album tag; caching UID"
            );
          }
      - if:
          condition:
            lambda: "return id(pending_tag_verifying) && !id(pending_tag_job_id).empty() && id(current_tag_url) == id(pending_tag_url);"
          then:
            - http_request.post:
                url: !lambda |-
                  return std::string("${album_cards_base_url}/api/hardware/tag-writes/") + id(pending_tag_job_id) + "/complete";
                request_headers:
                  Content-Type: application/json
                capture_response: true
                max_response_buffer_size: 512
                json: |-
                  root["ok"] = true;
                  root["tagUrl"] = id(pending_tag_url);
                  root["tagUid"] = id(current_tag_uid);
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(writer_status).publish_state("Verified album tag; cached UID");
                          id(pending_tag_job_id).clear();
                          id(pending_tag_url).clear();
                          id(pending_tag_verifying) = false;
                          id(pending_tag_verify_started_at) = 0;
                          id(current_tag_uid).clear();
                          id(current_tag_url).clear();
                          id(pending_url_sensor).publish_state("");
                          id(pn532_board).read_mode();
                          id(blink_write_success).execute();
                        } else {
                          id(writer_status).publish_state("Could not confirm verified tag write");
                          id(blink_writer_error).execute();
                        }
                on_error:
                  then:
                    - text_sensor.template.publish:
                        id: writer_status
                        state: "Could not confirm verified tag write"
                    - script.execute: blink_writer_error
      - if:
          condition:
            lambda: "return id(pending_tag_job_id).empty() && !id(current_tag_url).empty();"
          then:
            - http_request.post:
                url: ${album_cards_base_url}/api/hardware/tag-cache
                request_headers:
                  Content-Type: application/json
                capture_response: true
                max_response_buffer_size: 512
                json: |-
                  root["device"] = "${name}";
                  root["tagUid"] = id(current_tag_uid);
                  root["tagUrl"] = id(current_tag_url);
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(writer_status).publish_state("Cached tag UID");
                          id(blink_writer_info).execute();
                        } else {
                          id(writer_status).publish_state("Could not cache tag UID");
                          id(blink_writer_error).execute();
                        }
                on_error:
                  then:
                    - text_sensor.template.publish:
                        id: writer_status
                        state: "Could not cache tag UID"
                    - script.execute: blink_writer_error
      - if:
          condition:
            lambda: "return id(pending_tag_job_id).empty() && id(current_tag_url).empty();"
          then:
            - script.execute: blink_writer_info

button:
  - platform: template
    name: "Clear Pending Tag"
    icon: mdi:broom
    entity_category: config
    on_press:
      then:
        - lambda: |-
            id(pending_tag_job_id).clear();
            id(pending_tag_url).clear();
            id(pending_tag_verifying) = false;
            id(pending_tag_verify_started_at) = 0;
            id(current_tag_uid).clear();
            id(current_tag_url).clear();
            id(pn532_board).read_mode();
        - text_sensor.template.publish:
            id: writer_status
            state: "Cleared local pending tag"
        - text_sensor.template.publish:
            id: pending_url_sensor
            state: ""

text_sensor:
  - platform: template
    name: "Last Tag UID"
    id: last_tag_uid
    icon: mdi:nfc
    entity_category: diagnostic

  - platform: template
    name: "Pending Tag URL"
    id: pending_url_sensor
    icon: mdi:link
    entity_category: diagnostic

  - platform: template
    name: "Writer Status"
    id: writer_status
    icon: mdi:playlist-edit
    entity_category: diagnostic
