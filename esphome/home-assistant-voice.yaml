packages:
  remote_package_shorthand: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@dev

substitutions:
  hidden_ssid: "true"

esphome:
  name: home-assistant-voice
  friendly_name: Home Assistant Voice
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true # Required for hidden AP

api:
  encryption:
    key: !secret api_encryption_key

i2s_audio:
  - id: !remove i2s_output
  - id: i2s_output_spdif

speaker:
  - id: !remove i2s_audio_speaker
  - id: spdif_speaker
    platform: i2s_audio
    sample_rate: 48000
    i2s_mode: primary
    i2s_dout_pin: GPIO1
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output_spdif
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    use_apll: true
    i2s_comm_fmt: stand_i2s
    mclk_multiple: 256
    spdif_mode: true
  - id: !extend mixing_speaker
    output_speaker: spdif_speaker

switch:
  - platform: gpio
    pin: GPIO46
    id: grove_port_power
    restore_mode: ALWAYS_ON
    setup_priority: 1001  # This sets the pin to be on before the i2c scan happens (priority 1000)

media_player:
  - id: !extend external_media_player
    name: Media Player
    volume_increment: !remove
    volume_min: !remove
    volume_max: !remove
